        .badge {
            position: absolute;
            bottom: 40px;
            left: 50px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.4);

            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            color: #00f3ff;
            letter-spacing: 2px;

            right: 50px;
